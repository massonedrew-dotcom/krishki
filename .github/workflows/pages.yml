name: Preview on GitHub Pages

# Static preview of the site (apps/web export) + the 3D home prototype at /prototype/.
# The production build (standalone server, API, redirects) is separate.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: pnpm install --frozen-lockfile
      # Static export cannot run middleware; locale redirect is done by out/index.html below.
      - run: rm apps/web/src/middleware.ts
      - run: pnpm --filter @krishki/web build
        env:
          GITHUB_PAGES: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Add prototype and root redirect
        run: |
          mkdir -p apps/web/out/prototype
          cp -r prototypes/hero-scroll/. apps/web/out/prototype/
          rm -rf apps/web/out/prototype/tools
          BASE="${{ steps.pages.outputs.base_path }}"
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=%s/ru/"><link rel="canonical" href="%s/ru/"><title>ELIT KONSERVA</title>' "$BASE" "$BASE" > apps/web/out/index.html
          touch apps/web/out/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
